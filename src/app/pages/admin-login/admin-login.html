<section class="admin-login-page">

  <div class="login-card">

    <div class="login-icon">
      ✦
    </div>

    <p class="eyebrow">
      BEAUTY SALON
    </p>

    <h1>Admin Login</h1>

    <p class="subtitle">
      Sign in to manage the salon system.
    </p>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="username">Username</label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter password"
          required
        />
      </div>

      <div
        *ngIf="errorMessage"
        class="error-message">

        {{ errorMessage }}

      </div>

      <button
        type="submit"
        class="login-button">

        Sign In →

      </button>

    </form>

    <a
      routerLink="/"
      class="back-link">

      ← Back to website

    </a>

  </div>

</section>
